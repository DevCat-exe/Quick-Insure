name: Build and publish release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to publish, for example v2.2.1-test.1
        required: true
        default: v2.2.1-test.1
        type: string
      prerelease:
        description: Mark this release as a prerelease
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve release version
        id: release
        shell: pwsh
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'push') {
            $tag = $env:GITHUB_REF_NAME
          } else {
            $tag = $env:INPUT_RELEASE_TAG
          }

          if ($tag -notmatch '^v?(\d+)\.(\d+)\.(\d+)([-+].*)?$') {
            throw "Release tag must use semantic versioning, received: $tag"
          }

          $version = "$($Matches[1]).$($Matches[2]).$($Matches[3])"
          $buildNumber = ([long]$Matches[1] * 1000000) + ([long]$Matches[2] * 1000) + [long]$Matches[3]
          $isPrerelease = $tag.Contains('-')
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $isPrerelease = $env:INPUT_PRERELEASE -eq 'true'
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "build_number=$buildNumber" >> $env:GITHUB_OUTPUT
          "prerelease=$($isPrerelease.ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: Prepare release notes from changelog
        id: notes
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          IS_PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          $ErrorActionPreference = 'Stop'
          $changelog = Get-Content 'assets/CHANGELOG.md' -Raw
          $escapedVersion = [Regex]::Escape($env:RELEASE_VERSION)
          $versionPattern = "(?ms)^##\s+\[$escapedVersion\][^\r\n]*\r?\n(?<body>.*?)(?=^##\s+\[|\z)"
          $match = [Regex]::Match($changelog, $versionPattern)

          if ($match.Success) {
            $notes = $match.Groups['body'].Value.Trim()
          } elseif ($env:IS_PRERELEASE -eq 'true') {
            $latestPattern = '(?ms)^##\s+\[(?<version>\d+\.\d+\.\d+)\][^\r\n]*\r?\n(?<body>.*?)(?=^##\s+\[|\z)'
            $latest = [Regex]::Match($changelog, $latestPattern)
            if (-not $latest.Success) {
              throw 'No versioned changelog section was found in assets/CHANGELOG.md.'
            }
            $notes = "Manual update test for $($env:RELEASE_TAG). Notes below are from $($latest.Groups['version'].Value).`n`n$($latest.Groups['body'].Value.Trim())"
          } else {
            throw "Missing ## [$($env:RELEASE_VERSION)] section in assets/CHANGELOG.md. Add release notes before tagging."
          }

          $delimiter = "CHANGELOG_$([Guid]::NewGuid().ToString('N'))"
          $output = "body<<$delimiter`n$notes`n$delimiter`n"
          [System.IO.File]::AppendAllText(
            $env:GITHUB_OUTPUT,
            $output,
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Recreate Android signing files from secrets
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          $requiredSecrets = @(
            $env:ANDROID_KEYSTORE_BASE64,
            $env:ANDROID_KEYSTORE_PASSWORD,
            $env:ANDROID_KEY_ALIAS,
            $env:ANDROID_KEY_PASSWORD
          )
          if ($requiredSecrets | Where-Object { [string]::IsNullOrWhiteSpace($_) }) {
            throw 'One or more Android signing secrets are missing.'
          }

          $keystorePath = 'android/app/quickinsure.keystore'
          [System.IO.File]::WriteAllBytes(
            $keystorePath,
            [System.Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64)
          )

          $properties = @"
          storePassword=$($env:ANDROID_KEYSTORE_PASSWORD)
          keyPassword=$($env:ANDROID_KEY_PASSWORD)
          keyAlias=$($env:ANDROID_KEY_ALIAS)
          storeFile=quickinsure.keystore
          "@
          $propertiesPath = 'android/app/key.properties'
          [System.IO.File]::WriteAllText(
            $propertiesPath,
            $properties.Trim() + "`n",
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Install dependencies
        run: flutter pub get

      - name: Build update-test baseline clients
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          TEST_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pubspec = Get-Content pubspec.yaml -Raw
          if ($pubspec -notmatch '(?m)^version:\s*(\d+\.\d+\.\d+)\+(\d+)') {
            throw 'Could not read the current app version from pubspec.yaml.'
          }
          $baselineVersion = $Matches[1]
          $baselineBuild = [int]$Matches[2] + 1
          $testDefine = "--dart-define=QUICK_INSURE_TEST_RELEASE_TAG=$env:TEST_RELEASE_TAG"
          $testClients = 'build/update-test-clients'
          New-Item -ItemType Directory -Path $testClients -Force | Out-Null

          flutter build apk --release "--build-name=$baselineVersion" "--build-number=$baselineBuild" $testDefine
          if ($LASTEXITCODE -ne 0) { throw 'Baseline Android APK build failed.' }
          $baselineApk = 'build/app/outputs/flutter-apk/app-release.apk'
          if (-not (Test-Path $baselineApk)) { throw 'Baseline APK was not produced.' }
          Copy-Item $baselineApk "$testClients/quick_insure_update_test_client.apk"

          flutter build windows --release "--build-name=$baselineVersion" "--build-number=$baselineBuild" $testDefine
          if ($LASTEXITCODE -ne 0) { throw 'Baseline Windows build failed.' }
          $windowsRelease = 'build/windows/x64/runner/Release'
          if (-not (Test-Path $windowsRelease)) { throw 'Baseline Windows bundle was not produced.' }
          Compress-Archive -Path "$windowsRelease/*" -DestinationPath "$testClients/quick_insure_windows_update_test_client.zip" -CompressionLevel Optimal

      - name: Upload update-test baseline clients
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: quick-insure-update-test-clients
          path: build/update-test-clients/*
          retention-days: 7

      - name: Build signed Android APK
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_BUILD_NUMBER: ${{ steps.release.outputs.build_number }}
        run: flutter build apk --release "--build-name=$env:RELEASE_VERSION" "--build-number=$env:RELEASE_BUILD_NUMBER"

      - name: Build Windows desktop bundle
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_BUILD_NUMBER: ${{ steps.release.outputs.build_number }}
        run: flutter build windows --release "--build-name=$env:RELEASE_VERSION" "--build-number=$env:RELEASE_BUILD_NUMBER"

      - name: Build Windows Installer
        shell: pwsh
        env:
          QUICK_INSURE_APP_VERSION: ${{ steps.release.outputs.version }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:QUICK_INSURE_APP_VERSION)) {
            throw 'The release version is empty, so the installer cannot be labelled.'
          }
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 7\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $iscc) {
            $iscc = Get-ChildItem 'C:\Program Files*\Inno Setup*\ISCC.exe' -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $iscc) {
            $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          }
          if (-not $iscc) {
            throw 'Inno Setup compiler (ISCC.exe) was not found on this runner.'
          }
          Write-Host "Compiling the Windows installer with $iscc"
          & $iscc 'windows\installer.iss'
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE."
          }

      - name: Package release assets
        shell: pwsh
        run: |
          $releaseDirectory = 'build/release-assets'
          New-Item -ItemType Directory -Path $releaseDirectory -Force | Out-Null
          Copy-Item 'build/app/outputs/flutter-apk/app-release.apk' "$releaseDirectory/quick_insure.apk"
          Compress-Archive -Path 'build/windows/x64/runner/Release/*' -DestinationPath "$releaseDirectory/quick_insure_windows.zip" -CompressionLevel Optimal

      - name: Remove legacy versioned duplicate assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          $releaseJson = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_TAG" 2>$null
          if ($LASTEXITCODE -eq 0 -and $releaseJson) {
            $release = $releaseJson | ConvertFrom-Json
            foreach ($asset in $release.assets) {
              if ($asset.name -match '^quick_insure_(?:windows_)?v?\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?\.(?:apk|zip|exe)$') {
                gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/releases/assets/$($asset.id)"
                if ($LASTEXITCODE -ne 0) {
                  throw "Could not remove legacy duplicate asset $($asset.name)."
                }
              }
            }
          }

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Quick Insure ${{ steps.release.outputs.tag }}
          body: ${{ steps.notes.outputs.body }}
          generate_release_notes: false
          overwrite_files: true
          prerelease: ${{ steps.release.outputs.prerelease == 'true' }}
          files: |
            build/release-assets/quick_insure.apk
            build/release-assets/quick_insure_windows.zip
            build/release-assets/quick_insure_windows_setup.exe
